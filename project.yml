name: HidrataPOC
options:
  bundleIdPrefix: com.hidratapoc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: L9XGFW9W5W
    CODE_SIGN_STYLE: Automatic

targets:
  HidrataPOC:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: HidrataPOC
    info:
      path: HidrataPOC/Support/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Usamos sua localização para consultar a temperatura e umidade no momento dos lembretes de hidratação."
        NSCalendarsFullAccessUsageDescription: "Consultamos sua agenda apenas para saber se você está ocupado (sem ler título ou local dos eventos), para escolher melhores horários de lembrete."
        UIBackgroundModes:
          - fetch
          - remote-notification
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.hidratapoc.refresh
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    entitlements:
      path: HidrataPOC/Support/HidrataPOC.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hidratapoc
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.weatherkit: true
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.hidratapoc
    capabilities:
      - com.apple.developer.icloud-container-identifiers
      - com.apple.developer.weatherkit
    dependencies:
      - target: HydrationWidget
        embed: true
      - target: HydrationKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hidratapoc
        PRODUCT_NAME: HidrataPOC
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  HydrationKit:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: HydrationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hidratapoc.HydrationKit
        PRODUCT_NAME: HydrationKit
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
        DEFINES_MODULE: true

  HidrataPOCTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: HidrataPOCTests
    dependencies:
      - target: HidrataPOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hidratapoc.Tests
        GENERATE_INFOPLIST_FILE: true

  HydrationWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: HydrationWidget
      - path: HidrataPOC/Shared
      - path: HidrataPOC/Models
      - path: HidrataPOC/Services/PersistenceController.swift
      - path: HidrataPOC/Services/CloudKitSyncService.swift
      - path: HidrataPOC/Services/WaterIntakeCalculator.swift
      - path: HidrataPOC/Support/Constants.swift
    dependencies:
      - target: HydrationKit
        embed: false
    info:
      path: HydrationWidget/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HydrationWidget/HydrationWidget.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hidratapoc
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.hidratapoc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hidratapoc.HydrationWidget
        PRODUCT_NAME: HydrationWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
